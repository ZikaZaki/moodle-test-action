name: Moodle CI

on:
  pull_request:
    branches:
      - main
      - master
      - MOODLE_*_STABLE
  push:
    branches:
      - main
      - master
      - MOODLE_*_STABLE
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: write
  issues: write
  statuses: write

jobs:
  ci:
    uses: ZikaZaki/moodle-test-action/.github/workflows/ci.yml@main
    secrets: inherit
    with:
      dependencies: >-
        [
          "ZikaZaki/local_myplugin@master",
          "ZikaZaki/mod_otherplugin@MOODLE_42_STABLE"
        ]
